<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>科研项目管理系统</title>

    <link href="https://christianblairvordy.com/wp-content/uploads/2016/06/CB-Logo-Final-06.png" rel="shortcut icon"
          type="image/x-icon"/>
    <style>
        body, html, div, ul, li, button, p, img, h1, h2, h3, h4, h5, h6 {
            margin: 0;
            padding: 0;
        }

        body, html {
            background: #fff;
            line-height: 1.8;
        }

        h1, h2, h3, h4, h5, h6 {
            line-height: 1.8;
        }

        .email_warp {
            height: 100vh;
            min-height: 500px;
            font-size: 14px;
            color: #212121;
            display: flex;
            justify-content: center;
        }


        h1.email-title {
            font-size: 26px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #252525;
        }

        .warm_tips {
            color: #757575;
            background: #f7f7f7;
            padding: 20px;
        }

        .warm_tips {
            margin-bottom: 20px;
        }


        .qr_warp img {
            max-width: 100%;
            max-height: 100%;
        }

        .email-footer {
            margin-top: 2em;
        }

        #reset-password-email {
            max-width: 500px;
        }

        #reset-password-email {
            color: #4C84FF;
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
<section class="email_warp">
    <div id="reset-password-email">

        <h1 class="email-title">
            尊敬的<span>作者：author</span><br/>您好!
        </h1>
        <p>您的项目："name",于time已status</p>


        <div class="warm_tips">
            <div class="email-footer">
                <p>您的智能项目助理</p>
            </div>
            <p>本邮件由系统自动发送，请勿回复。</p>
        </div>


    </div>
</section>
</body>

</html>
